<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My History - Debug Visualizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
  <nav class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-gray-800">Debug Visualizer History</h1>
      <div class="flex items-center space-x-4">
        <a href="index.html" class="text-blue-600 hover:text-blue-700">Home</a>
        <a href="auth.html" class="text-blue-600 hover:text-blue-700">Account</a>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-4 py-8">
    <div id="auth-required" class="hidden text-center py-12">
      <h2 class="text-2xl font-semibold text-gray-700 mb-4">Please log in to view your history</h2>
      <a href="auth.html">
        <button class="bg-blue-600 text-white px-6 py-3 rounded-md font-semibold hover:bg-blue-700 transition">
          Go to Login
        </button>
      </a>
    </div>

    <div id="history-content" class="hidden">
      <div class="mb-8">
        <div class="flex space-x-4 border-b border-gray-300">
          <button id="tab-visualizations" class="tab-btn px-6 py-3 font-semibold text-blue-600 border-b-2 border-blue-600">
            Saved Visualizations
          </button>
          <button id="tab-leetcode" class="tab-btn px-6 py-3 font-semibold text-gray-600 hover:text-blue-600">
            LeetCode History
          </button>
        </div>
      </div>

      <div id="visualizations-tab" class="tab-content">
        <div class="mb-4 flex justify-between items-center">
          <h2 class="text-xl font-semibold text-gray-700">Your Saved Visualizations</h2>
          <button id="save-current" class="bg-green-600 text-white px-4 py-2 rounded-md font-semibold hover:bg-green-700 transition">
            Save Current Visualization
          </button>
        </div>

        <div id="visualizations-list" class="space-y-4">
          <div class="text-center py-8 text-gray-500">Loading...</div>
        </div>
      </div>

      <div id="leetcode-tab" class="tab-content hidden">
        <div class="mb-4">
          <h2 class="text-xl font-semibold text-gray-700">Recently Viewed LeetCode Problems</h2>
        </div>

        <div id="leetcode-list" class="space-y-4">
          <div class="text-center py-8 text-gray-500">Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = ''; // Use same origin - requests will be proxied to backend
    let currentUser = null;

    async function checkAuth() {
      try {
        const response = await fetch(`${API_BASE}/api/auth/me`, {
          credentials: 'include'
        });

        if (response.ok) {
          currentUser = await response.json();
          document.getElementById('auth-required').classList.add('hidden');
          document.getElementById('history-content').classList.remove('hidden');
          loadVisualizations();
          loadLeetCodeHistory();
        } else {
          document.getElementById('auth-required').classList.remove('hidden');
          document.getElementById('history-content').classList.add('hidden');
        }
      } catch (error) {
        console.error('Error checking auth:', error);
        document.getElementById('auth-required').classList.remove('hidden');
        document.getElementById('history-content').classList.add('hidden');
      }
    }

    async function loadVisualizations() {
      try {
        const response = await fetch(`${API_BASE}/api/visualizations?limit=50`, {
          credentials: 'include'
        });

        if (response.ok) {
          const visualizations = await response.json();
          displayVisualizations(visualizations);
        } else {
          document.getElementById('visualizations-list').innerHTML =
            '<div class="text-center py-8 text-red-500">Error loading visualizations</div>';
        }
      } catch (error) {
        console.error('Error loading visualizations:', error);
        document.getElementById('visualizations-list').innerHTML =
          '<div class="text-center py-8 text-red-500">Error loading visualizations</div>';
      }
    }

    function displayVisualizations(visualizations) {
      const container = document.getElementById('visualizations-list');

      if (visualizations.length === 0) {
        container.innerHTML = '<div class="text-center py-8 text-gray-500">No saved visualizations yet</div>';
        return;
      }

      container.innerHTML = visualizations.map(viz => `
        <div class="bg-white p-6 rounded-lg shadow-md">
          <div class="flex justify-between items-start mb-4">
            <div class="flex-1">
              <h3 class="text-lg font-semibold text-gray-800">${escapeHtml(viz.title)}</h3>
              <p class="text-gray-600 text-sm">${escapeHtml(viz.description)}</p>
              <p class="text-gray-400 text-xs mt-2">${new Date(viz.created_at).toLocaleString()}</p>
            </div>
            <div class="flex items-center space-x-2">
              <button onclick="toggleFavorite(${viz.id})" class="text-yellow-500 hover:text-yellow-600">
                ${viz.is_favorite ? '★' : '☆'}
              </button>
              <button onclick="loadVisualization(${viz.id})" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">
                Load
              </button>
              <button onclick="deleteVisualization(${viz.id})" class="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700 transition">
                Delete
              </button>
            </div>
          </div>
          <div class="bg-gray-50 p-3 rounded">
            <pre class="text-xs overflow-x-auto"><code>${escapeHtml(viz.code.substring(0, 200))}${viz.code.length > 200 ? '...' : ''}</code></pre>
          </div>
        </div>
      `).join('');
    }

    async function loadLeetCodeHistory() {
      try {
        const response = await fetch(`${API_BASE}/api/leetcode/history?limit=50`, {
          credentials: 'include'
        });

        if (response.ok) {
          const history = await response.json();
          displayLeetCodeHistory(history);
        } else {
          document.getElementById('leetcode-list').innerHTML =
            '<div class="text-center py-8 text-red-500">Error loading LeetCode history</div>';
        }
      } catch (error) {
        console.error('Error loading LeetCode history:', error);
        document.getElementById('leetcode-list').innerHTML =
          '<div class="text-center py-8 text-red-500">Error loading LeetCode history</div>';
      }
    }

    function displayLeetCodeHistory(history) {
      const container = document.getElementById('leetcode-list');

      if (history.length === 0) {
        container.innerHTML = '<div class="text-center py-8 text-gray-500">No LeetCode problems viewed yet</div>';
        return;
      }

      container.innerHTML = history.map(entry => `
        <div class="bg-white p-6 rounded-lg shadow-md flex justify-between items-center">
          <div class="flex-1">
            <h3 class="text-lg font-semibold text-gray-800">${entry.problem_id}. ${escapeHtml(entry.problem_title)}</h3>
            <p class="text-gray-600 text-sm">Slug: ${escapeHtml(entry.problem_slug)}</p>
            <p class="text-gray-400 text-xs mt-2">
              Last viewed: ${new Date(entry.last_viewed).toLocaleString()} |
              Viewed ${entry.view_count} time${entry.view_count !== 1 ? 's' : ''}
            </p>
            ${entry.notes ? `<p class="text-gray-700 text-sm mt-2 italic">"${escapeHtml(entry.notes)}"</p>` : ''}
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="loadLeetCodeProblem('${entry.problem_slug}')" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">
              Load Problem
            </button>
            <button onclick="editNotes(${entry.problem_id}, '${escapeHtml(entry.notes)}')" class="bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700 transition">
              ${entry.notes ? 'Edit Notes' : 'Add Notes'}
            </button>
          </div>
        </div>
      `).join('');
    }

    async function loadVisualization(vizId) {
      try {
        const response = await fetch(`${API_BASE}/api/visualizations/${vizId}`, {
          credentials: 'include'
        });

        if (response.ok) {
          const viz = await response.json();
          const url = new URL('manual.html', window.location.origin);
          url.searchParams.set('user-code', viz.code);
          url.searchParams.set('included-variables', viz.included_variables);
          url.searchParams.set('selected-variables', viz.selected_variables);
          window.location.href = url.toString();
        } else {
          alert('Error loading visualization');
        }
      } catch (error) {
        console.error('Error loading visualization:', error);
        alert('Error loading visualization');
      }
    }

    async function deleteVisualization(vizId) {
      if (!confirm('Are you sure you want to delete this visualization?')) {
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/visualizations/${vizId}`, {
          method: 'DELETE',
          credentials: 'include'
        });

        if (response.ok) {
          loadVisualizations();
        } else {
          alert('Error deleting visualization');
        }
      } catch (error) {
        console.error('Error deleting visualization:', error);
        alert('Error deleting visualization');
      }
    }

    async function toggleFavorite(vizId) {
      try {
        const response = await fetch(`${API_BASE}/api/visualizations/${vizId}/favorite`, {
          method: 'POST',
          credentials: 'include'
        });

        if (response.ok) {
          loadVisualizations();
        } else {
          alert('Error toggling favorite');
        }
      } catch (error) {
        console.error('Error toggling favorite:', error);
      }
    }

    function loadLeetCodeProblem(slug) {
      window.location.href = `leetcode.html?problem=${slug}`;
    }

    function editNotes(problemId, currentNotes) {
      const notes = prompt('Enter your notes for this problem:', currentNotes || '');
      if (notes === null) return; // User cancelled

      fetch(`${API_BASE}/api/leetcode/${problemId}/notes`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json'
        },
        credentials: 'include',
        body: JSON.stringify({ notes })
      }).then(response => {
        if (response.ok) {
          loadLeetCodeHistory();
        } else {
          alert('Error updating notes');
        }
      }).catch(error => {
        console.error('Error updating notes:', error);
        alert('Error updating notes');
      });
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Tab switching
    document.getElementById('tab-visualizations').addEventListener('click', () => {
      document.getElementById('visualizations-tab').classList.remove('hidden');
      document.getElementById('leetcode-tab').classList.add('hidden');
      document.getElementById('tab-visualizations').classList.add('text-blue-600', 'border-blue-600');
      document.getElementById('tab-visualizations').classList.remove('text-gray-600');
      document.getElementById('tab-leetcode').classList.remove('text-blue-600', 'border-blue-600');
      document.getElementById('tab-leetcode').classList.add('text-gray-600');
    });

    document.getElementById('tab-leetcode').addEventListener('click', () => {
      document.getElementById('visualizations-tab').classList.add('hidden');
      document.getElementById('leetcode-tab').classList.remove('hidden');
      document.getElementById('tab-leetcode').classList.add('text-blue-600', 'border-blue-600');
      document.getElementById('tab-leetcode').classList.remove('text-gray-600');
      document.getElementById('tab-visualizations').classList.remove('text-blue-600', 'border-blue-600');
      document.getElementById('tab-visualizations').classList.add('text-gray-600');
    });

    // Save current visualization
    document.getElementById('save-current').addEventListener('click', () => {
      const title = prompt('Enter a title for this visualization:');
      if (!title) return;

      const description = prompt('Enter a description (optional):') || '';

      // Get code from localStorage or URL params
      const urlParams = new URLSearchParams(window.location.search);
      const code = localStorage.getItem('lastCode') || '';
      const includedVars = localStorage.getItem('lastIncludedVars') || '';
      const selectedVars = localStorage.getItem('lastSelectedVars') || '';

      fetch(`${API_BASE}/api/visualizations`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        credentials: 'include',
        body: JSON.stringify({
          title,
          description,
          code,
          included_variables: includedVars,
          selected_variables: selectedVars,
          visualization_config: '{}'
        })
      }).then(response => {
        if (response.ok) {
          alert('Visualization saved!');
          loadVisualizations();
        } else {
          alert('Error saving visualization. Make sure you are logged in.');
        }
      }).catch(error => {
        console.error('Error saving visualization:', error);
        alert('Error saving visualization');
      });
    });

    checkAuth();
  </script>
</body>
</html>
