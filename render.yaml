services:
  - type: web
    name: leetcode-visualizer-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        value: https://YOUR_GITHUB_USERNAME.github.io/YOUR_REPO_NAME  # Update this after deploying to GitHub Pages
