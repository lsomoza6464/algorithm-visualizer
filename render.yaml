services:
  - type: web
    name: leetcode-visualizer-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        value: https://lsomoza6464.github.io/algorithm-visualizer
