        // Store the Monaco editor instance globally for access by app.js if needed
        let monacoEditorInstance;

        // Configure Monaco Loader
        require.config({ paths: { 'vs': 'https://unpkg.com/monaco-editor@0.49.0/min/vs' }});

        // Function to populate form from URL parameters
        function populateFormFromURLParams() {
            const urlParams = new URLSearchParams(window.location.search);

            // Get parameters from URL
            const userCode = urlParams.get('user-code');
            const includedVariables = urlParams.get('included-variables');
            const selectedVariables = urlParams.get('selected-variables');
            const leetcodeProblem = urlParams.get('leetcode-problem');
            const problemTitle = urlParams.get('problem-title');
            const problemId = urlParams.get('problem-id');

            // Update form fields if parameters exist
            if (includedVariables) {
                document.getElementById('included-variables').value = includedVariables;
            }
            if (selectedVariables) {
                document.getElementById('selected-variables').value = selectedVariables;
            }
            if (leetcodeProblem) {
                document.getElementById('leetcode-problem').value = leetcodeProblem;
            }

            // Update page title if problem info is available
            if (problemTitle && problemId) {
                const titleElement = document.querySelector('h1');
                titleElement.textContent = `${problemId}. ${problemTitle} - Visualizer`;
            }

            // Record LeetCode problem view if problem parameters exist
            if (leetcodeProblem && problemId) {
                recordLeetCodeView(parseInt(problemId), leetcodeProblem, problemTitle || '');
            }

            // Return the user code to be set in Monaco editor
            return userCode;
        }

        // Function to record LeetCode problem view
        async function recordLeetCodeView(problemId, problemSlug, problemTitle) {
            try {
                const response = await fetch('/api/leetcode/view', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        problem_id: problemId,
                        problem_slug: problemSlug,
                        problem_title: problemTitle
                    })
                });

                if (response.ok) {
                    console.log('LeetCode view recorded');
                } else {
                    console.warn('Failed to record LeetCode view (may not be logged in)');
                }
            } catch (error) {
                console.error('Error recording LeetCode view:', error);
            }
        }

        // Function to populate LeetCode problems datalist
        async function populateLeetCodeProblems() {
            try {
                const problems = await fetchLeetCodeProblemsList();
                const datalist = document.getElementById('leetcode-problems-list');
                
                // Clear existing options
                datalist.innerHTML = '';
                
                // Add each problem as an option
                problems.forEach(problem => {
                    const option = document.createElement('option');
                    option.value = problem.slug;
                    option.textContent = `${problem.id} - ${problem.title}`;
                    datalist.appendChild(option);
                });
                
                console.log(`Loaded ${problems.length} LeetCode problems for autocomplete`);
            } catch (error) {
                console.error('Error loading LeetCode problems for datalist:', error);
            }
        }

        // Function to search and fetch LeetCode problem info
        async function searchLeetCodeProblem(slug) {
            try {
                // Use a CORS proxy to avoid browser restrictions
                const corsProxy = 'https://cors-anywhere.herokuapp.com/';
                const leetcodeUrl = 'https://leetcode.com/graphql';
                
                const response = await fetch(`${corsProxy}${leetcodeUrl}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Referer': `https://leetcode.com/problems/${slug}/`,
                        'Origin': window.location.origin,
                    },
                    body: JSON.stringify({
                        query: `
                            query getQuestionDetail($titleSlug: String!) {
                                question(titleSlug: $titleSlug) {
                                    title
                                    questionId
                                    exampleTestcases
                                    codeSnippets {
                                        lang
                                        langSlug
                                        code
                                    }
                                    content
                                }
                            }
                        `,
                        variables: { titleSlug: slug }
                    })
                });

                if (!response.ok) {
                    if (response.status === 403) {
                        throw new Error('CORS proxy rate limit reached. Please use "Search Local" instead.');
                    }
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                const question = data.data.question;
                
                if (!question) {
                    throw new Error('Problem not found');
                }

                const jsSnippet = question.codeSnippets.find(snippet => snippet.langSlug === 'javascript');
                
                return {
                    title: question.title,
                    exampleTestcases: question.exampleTestcases ? question.exampleTestcases.split('\n') : [],
                    starterCode: jsSnippet ? jsSnippet.code : '',
                    content: question.content
                };
            } catch (error) {
                console.error('Error fetching LeetCode problem from API:', error);
                
                // Fallback: try to use the existing leetcode-loader.js system
                try {
                    console.log('Trying fallback to local leetcode-loader.js...');
                    
                    // Check if we have this problem in our local database
                    const problems = await fetchLeetCodeProblemsList();
                    const problem = problems.find(p => p.slug === slug);
                    
                    if (problem) {
                        // Use the existing system to get defaults
                        const defaults = await getLeetCodeDefaults(problem.id);
                        
                        return {
                            title: defaults['problem-title'],
                            starterCode: defaults['user-code'],
                            content: `Problem ${problem.id}: ${problem.title} - Using local solution data.`,
                            isLocal: true
                        };
                    } else {
                        throw new Error('Problem not found in local database');
                    }
                } catch (fallbackError) {
                    console.error('Fallback also failed:', fallbackError);
                    
                    // Provide helpful error message
                    if (error.message.includes('CORS') || error.message.includes('rate limit')) {
                        throw new Error(`Online search failed: ${error.message}. Use "Search Local" for problems in your database, or try the "Load Problem" button below.`);
                    } else {
                        throw new Error(`Failed to fetch problem: ${error.message}. Try using "Search Local" or the "Load Problem" button instead.`);
                    }
                }
            }
        }

}

const left = tree.left;

    new GraphNode("J"),
    new GraphNode("K"),
    new GraphNode("L")
]);
let neighbor = graph;
while (neighbor != null) {
    neighbor = neighbor.neighbors[0];

            require(['vs/editor/editor.main'], function() {
                let currentHighlightDecorations = []; 
                monacoEditorInstance = monaco.editor.create(document.getElementById('monaco-editor-container'), {

                    scrollBeyondLastLine: false, // Don't scroll past the last line

                    fontFamily: 'Inter, monospace', // Use Inter font, fallback to monospace

                window.highlightLine = (lineNumber) => {
                    if (!monacoEditorInstance) {
                        console.warn('Monaco editor not initialized yet.');

                    currentHighlightDecorations = monacoEditorInstance.deltaDecorations(
                        currentHighlightDecorations,
                        []

                    // Apply new decoration if a valid line number is provided
                    if (lineNumber > 0 && lineNumber <= monacoEditorInstance.getModel().getLineCount()) {

                            [],
                            [

                    } catch (error) {
                        console.error('[Load Problem] Error:', error);
                        alert(`Error loading problem: ${error.message}\n\nCheck the browser console for more details.`);
                    }
                });

                document.getElementById('search-leetcode-btn').addEventListener('click', async () => {

                    } catch (error) {

                <div id="visualization-container" class="bg-gray-50 border border-gray-300 rounded-md p-4 shadow-sm">
                    <!-- Visualization content will be rendered here by D3/JS -->
                </div>
            </div>
        </div>
        <br>
        <!--<div id="visualization-container" class="mt-8">
        </div>-->
    </div>
    
    <!-- Scripts -->
    <!-- Environment configuration -->
    <script src="config.js"></script>

    <!-- Save visualization functionality -->
    <script>

        document.getElementById('save-visualization-btn').addEventListener('click', async () => {
            try {
                // Check if user is logged in
                const authResponse = await fetch(`${API_BASE}/api/auth/me`, {
                    credentials: 'include'
                });

                if (!authResponse.ok) {
                    alert('Please log in to save visualizations');
                    window.location.href = 'auth.html';
                    return;
                }

                // Get title and description from user
                const title = prompt('Enter a title for this visualization:');
                if (!title) return; // User cancelled

                const description = prompt('Enter a description (optional):') || '';

                // Get code and variables from localStorage (set when code is submitted)
                const code = localStorage.getItem('lastCode') || '';
                const includedVars = localStorage.getItem('lastIncludedVars') || '';
                const selectedVars = localStorage.getItem('lastSelectedVars') || '';

                if (!code) {
                    alert('No code to save. Please submit your code first by clicking "Submit your code".');
                    return;
                }

                // Save to backend
                const saveResponse = await fetch(`${API_BASE}/api/visualizations`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        title,
                        description,
                        code,
                        included_variables: includedVars,
                        selected_variables: selectedVars,
                        visualization_config: '{}'
                    })
                });

                if (saveResponse.ok) {
                    const result = await saveResponse.json();
                    alert('Visualization saved successfully!');
                    console.log('Saved visualization:', result);
                } else {
                    const error = await saveResponse.json();
                    alert('Error saving visualization: ' + (error.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error saving visualization:', error);
                console.error('Error details:', error.message, error.stack);
                alert('Error: ' + error.message + '\n\nCheck browser console for details.');
            }
        });
    </script>

    <!-- Only the main app.js needs type="module" - it imports all other modules -->
    <script src="app.js" type="module"></script>
</body>
</html>
